name: soda
description: Student Overloaded by Deadlines and Activities. Android and web.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1      # state kept out of widgets
  fl_chart: ^0.69.0             # the charts, each wrapped in Semantics
  drift: ^2.20.0                # local cache and the queued draft store
  sqlite3_flutter_libs: ^0.5.24
  supabase_flutter: ^2.8.0      # auth and the user's own rows, RLS enforced
  http: ^1.2.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
